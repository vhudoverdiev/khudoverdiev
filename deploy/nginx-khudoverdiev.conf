server {
    listen 80;
    listen [::]:80;
    server_name khudoverdiev.ru www.khudoverdiev.ru it.khudoverdiev.ru ph.khudoverdiev.ru;

    server_tokens off;
    client_max_body_size 16k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }

    location ~* \.(?:bak|backup|db|dump|env|ini|log|map|old|orig|py|pyc|save|sql|sqlite|swp|tar|tgz|zip)$ {
        deny all;
        return 404;
    }

    location /static/ {
        alias /opt/khudoverdiev/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
