<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Письмо | Владимир Худовердиев</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f4f0e8">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='portfolio/vh-favicon.svg') }}?v=7">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pismo.css') }}?v=2">
</head>
<body>
    <main class="pismo-shell">
        {% if not authorized %}
            <section class="login-card" aria-labelledby="login-title">
                <a class="brand" href="{{ url_for('index') }}">IT<span>.</span></a>
                <p class="eyebrow">Закрытая страница</p>
                <h1 id="login-title">Вход</h1>
                <form method="post" class="login-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="action" value="login">
                    <label>
                        <span>Логин</span>
                        <input type="text" name="username" autocomplete="username" required autofocus>
                    </label>
                    <label>
                        <span>Пароль</span>
                        <input type="password" name="password" autocomplete="current-password" required>
                    </label>
                    {% if error %}<p class="form-message error" role="alert">{{ error }}</p>{% endif %}
                    <button type="submit">Открыть письмо</button>
                </form>
            </section>
        {% else %}
            <header class="editor-header">
                <div>
                    <a class="brand" href="{{ url_for('index') }}">IT<span>.</span></a>
                    <p class="eyebrow">Редактор письма</p>
                    <h1>Письмо для отклика</h1>
                </div>
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="action" value="logout">
                    <button class="secondary-button" type="submit">Выйти</button>
                </form>
            </header>

            <section class="editor-grid">
                <form method="post" class="editor-card">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="action" value="save">
                    <label for="letter">Текст письма</label>
                    <textarea id="letter" name="letter" maxlength="12000" spellcheck="true">{{ letter }}</textarea>
                    <div class="editor-actions">
                        {% if saved %}<p class="form-message success" role="status">Сохранено</p>{% endif %}
                        <button type="submit">Сохранить</button>
                    </div>
                </form>

                <article class="preview-card" aria-label="Предпросмотр письма">
                    <p class="preview-label">Предпросмотр</p>
                    <div class="letter-preview">{{ letter }}</div>
                </article>
            </section>
        {% endif %}
    </main>
</body>
</html>
